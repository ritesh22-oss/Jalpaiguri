<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYJPG — Jalpaiguri Address &amp; Landmark Lookup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: 'Roboto', sans-serif !important;
      }
      .row {
        margin: 0;
      }
      #checkout-form {
        padding: 20px;
        border-right: 1px solid #e0e0e0;
        height: 100vh;
        overflow-y: auto;
      }
      #map {
        height: 100vh;
      }
      #status-banner {
        display: none;
        padding: 8px 12px;
        border-radius: 8px;
        background: #fff3cd;
        color: #664d03;
        font-size: 12px;
        margin-bottom: 12px;
      }
      #combined-address {
        border: none;
        resize: none;
        overflow: hidden;
        height: 6em;
      }
      .descriptor-marker {
        background-color: #007aff;
        border-radius: 50%;
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border: 2px solid #ffffff;
      }
      .highlighted {
        background-color: #d9383a !important;
      }
    </style>
  </head>

  <body>
    <div class="row">
      <div class="col s12 m4 l3" id="checkout-form">
        <h5>Jalpaiguri Address Lookup</h5>
        <div id="status-banner"></div>

        <div class="row">
          <div class="col s12" style="margin-bottom: 12px;">
            <label style="font-size: 12px; color: #555; display: block; margin-bottom: 4px;">Search Jalpaiguri Place</label>
            <div id="autocomplete-host"></div>
          </div>
          <div class="input-field col s12">
            <select id="landmarks">
              <option value="" disabled selected>Choose a nearby landmark</option>
            </select>
            <label for="landmarks">Landmark</label>
          </div>
          <div class="input-field col s12">
            <input type="text" id="city" />
            <label for="city">City</label>
          </div>
          <div class="input-field col s6">
            <input type="text" id="state-province" />
            <label for="state-province">State</label>
          </div>
          <div class="input-field col s6">
            <input type="text" id="zip-postal-code" />
            <label for="zip-postal-code">PIN Code</label>
          </div>
          <div class="input-field col s12">
            <input type="text" id="country" />
            <label for="country">Country</label>
          </div>
        </div>

        <div class="input-field col s12">
          <textarea id="combined-address" readonly></textarea>
        </div>
      </div>

      <div class="col s12 m8 l9" style="padding: 0;">
        <div id="map"></div>
      </div>
    </div>

    <script>
      function showStatus(msg) {
        const el = document.getElementById('status-banner');
        if (!el) return;
        if (!msg) {
          el.style.display = 'none';
          el.textContent = '';
        } else {
          el.textContent = msg;
          el.style.display = 'block';
        }
      }

      function loadGoogleMapsBootstrap(apiKey) {
        return new Promise((resolve, reject) => {
          if (window.google && window.google.maps && window.google.maps.importLibrary) {
            return resolve();
          }
          const g = {
            key: apiKey,
            v: 'weekly',
            region: 'IN',
            language: 'en',
            solutionChannel: 'gmp_mcp_codeassist_v1_aistudio'
          };
          ((g) => {
            var h, a, k, p = 'The Google Maps JavaScript API', c = 'google', l = 'importLibrary', q = '__ib__', m = document, b = window;
            b = b[c] || (b[c] = {});
            var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(),
              u = () => h || (h = new Promise(async (f, n) => {
                await (a = m.createElement('script'));
                e.set('libraries', [...r] + '');
                for (k in g) e.set(k.replace(/[A-Z]/g, (t) => '_' + t[0].toLowerCase()), g[k]);
                e.set('callback', c + '.maps.' + q);
                a.src = 'https://maps.' + c + 'apis.com/maps/api/js?' + e;
                d[q] = f;
                a.onerror = () => h = n(Error(p + ' could not load.'));
                a.nonce = m.querySelector('script[nonce]')?.nonce || '';
                m.head.append(a);
              }));
            d[l] ? console.warn(p + ' only loads once.') : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n));
          })(g);
          google.maps.importLibrary('maps').then(resolve).catch(reject);
        });
      }

      async function initApp() {
        let apiKey = '';
        try {
          const resp = await fetch('/api/config/maps-key');
          const data = await resp.json();
          apiKey = data?.apiKey || '';
        } catch (err) {
          showStatus('Unable to reach maps configuration endpoint.');
          return;
        }

        if (!apiKey) {
          showStatus('Google Maps API key not configured on server.');
          return;
        }

        await loadGoogleMapsBootstrap(apiKey);

        const { Map: GoogleMap, InfoWindow } = await google.maps.importLibrary('maps');
        const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
        const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');

        const jalpaiguriCenter = { lat: 26.5228, lng: 88.7245 };
        const map = new GoogleMap(document.getElementById('map'), {
          center: jalpaiguriCenter,
          zoom: 15,
          mapId: 'DEMO_MAP_ID'
        });

        const marker = new AdvancedMarkerElement({
          map,
          position: jalpaiguriCenter,
          gmpDraggable: true
        });

        const autocompleteEl = new PlaceAutocompleteElement({
          locationBias: {
            center: jalpaiguriCenter,
            radius: 25000
          }
        });
        document.getElementById('autocomplete-host').appendChild(autocompleteEl);

        const cityInput = document.getElementById('city');
        const stateInput = document.getElementById('state-province');
        const zipInput = document.getElementById('zip-postal-code');
        const countryInput = document.getElementById('country');
        const combinedAddressInput = document.getElementById('combined-address');
        const landmarksSelect = document.getElementById('landmarks');

        let infoWindow = null;

        function fillComponents(addressComponents, formatted) {
          cityInput.value = '';
          stateInput.value = '';
          zipInput.value = '';
          countryInput.value = '';

          (addressComponents || []).forEach((c) => {
            const types = c.types || [];
            if (types.includes('locality')) cityInput.value = c.longText || c.long_name || '';
            if (types.includes('administrative_area_level_1')) stateInput.value = c.shortText || c.short_name || '';
            if (types.includes('postal_code')) zipInput.value = c.longText || c.long_name || '';
            if (types.includes('country')) countryInput.value = c.longText || c.long_name || '';
          });

          combinedAddressInput.value = formatted || '';
          M.updateTextFields();
        }

        autocompleteEl.addEventListener('gmp-select', async ({ placePrediction }) => {
          showStatus('');
          if (!placePrediction) return;
          const place = placePrediction.toPlace();
          await place.fetchFields({
            fields: ['displayName', 'formattedAddress', 'location', 'addressComponents']
          });

          if (!place.location) {
            showStatus('No coordinates returned for selected place.');
            return;
          }

          marker.position = place.location;
          map.panTo(place.location);
          map.setZoom(16);
          fillComponents(place.addressComponents, place.formattedAddress);

          if (!infoWindow) {
            infoWindow = new InfoWindow({ headerDisabled: true });
          }
          infoWindow.setContent(place.displayName || place.formattedAddress || 'Selected Place');
          infoWindow.open(map, marker);
        });

        marker.addListener('dragend', async () => {
          const pos = marker.position;
          if (!pos) return;
          const lat = typeof pos.lat === 'function' ? pos.lat() : pos.lat;
          const lng = typeof pos.lng === 'function' ? pos.lng() : pos.lng;
          try {
            const res = await fetch(`/api/location/reverse-geocode?lat=${lat}&lng=${lng}`);
            const data = await res.json();
            if (data?.success) {
              cityInput.value = data.city || 'Jalpaiguri';
              stateInput.value = data.state || 'West Bengal';
              zipInput.value = data.pincode || '';
              countryInput.value = data.country || 'India';
              combinedAddressInput.value = data.name || '';
              landmarksSelect.innerHTML = `<option value="1" selected>${data.locality || data.name}</option>`;
              M.FormSelect.init(landmarksSelect);
              M.updateTextFields();
            }
          } catch (err) {
            showStatus('Reverse geocode failed for dragged position.');
          }
        });

        M.FormSelect.init(landmarksSelect);
      }

      initApp();
    </script>
  </body>
</html>
